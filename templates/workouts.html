<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FitTracker — Workouts</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <img src="../assets/icons/logo.svg" class="logo" alt="FitTracker logo">
      <nav class="menu">
        <a href="../index.html">Dashboard</a>
        <a class="active" href="#">Workouts</a>
        <a href="schedule.html">Schedule</a>
        <a href="reports.html">Reports</a>
      </nav>
    </div>
    <div class="nav-right">
      <button class="icon-btn" aria-label="Notificaciones"><img src="../assets/icons/bell.svg" alt=""></button>
      <div class="user-avatar">JD</div>
    </div>
  </header>

  <main class="container">
    <section class="welcome">
      <h1>Your Workouts</h1>
      <p>Browse and manage your workout plans</p>
    </section>

    <section class="workouts-grid">
      <article class="card">
        <h3>Full Body Routine</h3>
        <p>45 min • 5 exercises</p>
        <div class="card-actions">
          <button class="btn">Start</button>
          <button class="btn ghost">Edit</button>
        </div>
      </article>

      <article class="card">
        <h3>Upper Body Strength</h3>
        <p>60 min • 6 exercises</p>
        <div class="card-actions">
          <button class="btn">Start</button>
          <button class="btn ghost">Edit</button>
        </div>
      </article>

      <article class="card">
        <h3>Leg Day</h3>
        <p>50 min • 6 exercises</p>
        <div class="card-actions">
          <button class="btn">Start</button>
          <button class="btn ghost">Edit</button>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
